<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <defs>
    <linearGradient id="rl" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <!-- Soft pastel brand badge -->
  <rect x="0" y="0" width="40" height="40" rx="12" fill="url(#rl)"/>
  <text x="20" y="27" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">RL</text>
  <!-- Wordmark -->
  <text x="50" y="27" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="18" fill="#3C3022">earn</text>
</svg>
