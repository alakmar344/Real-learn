services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: reallearn

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      NODE_ENV: production
      PORT: "10000"
      MONGODB_URI: mongodb://mongodb:27017/reallearn
      FRONTEND_ORIGIN: http://localhost:3000
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_ISSUER: ${CLERK_ISSUER}
      SERPER_API_KEY: ${SERPER_API_KEY}
      UA_HASH_SALT: ${UA_HASH_SALT}
    depends_on:
      - mongodb

volumes:
  mongo_data:
